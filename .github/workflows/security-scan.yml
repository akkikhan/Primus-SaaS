name: Primus Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore tools/PrimusSecurityScanner

    - name: Build Scanner
      run: dotnet build tools/PrimusSecurityScanner --no-restore

    - name: Run Security Scan
      # Note: Dependency Scanning requires cve-database.db. 
      # If not present, it will skip dependency scanning but run secret scanning.
      run: |
        dotnet run --project tools/PrimusSecurityScanner -- \
          --scan . \
          --patterns sdk/dotnet/PrimusSaaS.Security/SecretPatterns.json \
          --db data/cve-database/cve-database.db
