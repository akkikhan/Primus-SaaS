name: Backend API - Build and Deploy

on:
  push:
    branches:
      - master
      - dev-*
    paths:
      - 'portal/backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'portal/backend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'primus-saas-dev-api'
  AZURE_WEBAPP_PACKAGE_PATH: './portal/backend'
  DOTNET_VERSION: '7.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Build
      run: dotnet build ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Publish
      run: dotnet publish ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --configuration Release --no-build --output ${{github.workspace}}/publish

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: backend-api
        path: ${{github.workspace}}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: backend-api

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: .

    - name: Run Database Migrations
      run: |
        # Note: Migrations should be run using Azure CLI or a separate migration job
        # This is a placeholder for the migration step
        echo "Database migrations should be handled separately"

    - name: Azure logout
      run: az logout
      if: always()
