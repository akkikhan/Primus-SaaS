name: CI/CD Pipeline

on:
  push:
    branches: [ master, dev-* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
      
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # Test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: portal/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:run
      
      - name: Build
        run: npm run build

  # Test SDKs
  test-dotnet-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dotnet/PrimusSaaS.Identity.Validator
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
      
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  test-nodejs-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/nodejs/primus-identity-validator
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/nodejs/primus-identity-validator/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Build
        run: npm run build

  # Docker Build (on tags only)
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: portal/backend/Dockerfile
          push: false
          tags: primus-portal-backend:${{ github.ref_name }}
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: portal/frontend/Dockerfile
          push: false
          tags: primus-portal-frontend:${{ github.ref_name }}

  # Publish SDKs (on tags only)
  publish-sdks:
    runs-on: ubuntu-latest
    needs: [test-dotnet-sdk, test-nodejs-sdk]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      
      - name: Pack .NET SDK
        working-directory: sdk/dotnet/PrimusSaaS.Identity.Validator
        run: dotnet pack --configuration Release --output ./nupkg
      
      - name: Publish to NuGet (commented - requires API key)
        working-directory: sdk/dotnet/PrimusSaaS.Identity.Validator
        run: echo "dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json"
        # Uncomment when ready: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      
      - name: Publish to NPM (commented - requires auth)
        working-directory: sdk/nodejs/primus-identity-validator
        run: echo "npm publish --access public"
        # Uncomment when ready: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
