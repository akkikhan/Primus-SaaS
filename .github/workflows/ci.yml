name: CI

on:
  push:
    branches: [main, master, develop, dev, "*release*"]
  pull_request:
    branches: ["*"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  backend:
    name: Backend (.NET API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Restore
        run: dotnet restore "Primus SaaS.sln"
      - name: Build
        run: dotnet build "Primus SaaS.sln" --no-restore --configuration Release

  dotnet-sdks:
    name: SDK (.NET) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Restore
        run: dotnet restore "Primus SaaS.sln"
      - name: Test Identity Validator
        run: dotnet test sdk/dotnet/PrimusSaaS.Identity.Validator.Tests/PrimusSaaS.Identity.Validator.Tests.csproj --no-build --configuration Release
      - name: Test Logging SDK
        run: dotnet test sdk/logging/dotnet/PrimusSaaS.Logging.Tests/PrimusSaaS.Logging.Tests.csproj --no-build --configuration Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - name: Install
        working-directory: ${{ github.workspace }}/portal/frontend
        run: npm ci
      - name: Lint
        working-directory: ${{ github.workspace }}/portal/frontend
        run: npm run lint -- --max-warnings=0
      - name: Test
        working-directory: ${{ github.workspace }}/portal/frontend
        run: npm run test -- --runInBand
      - name: Build
        working-directory: ${{ github.workspace }}/portal/frontend
        run: npm run build

  node-packages:
    name: Node SDKs (tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - sdk/nodejs/primus-identity-validator
          - sdk/logging/nodejs
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package_dir }}/package-lock.json
      - name: Install
        working-directory: ${{ github.workspace }}/${{ matrix.package_dir }}
        run: npm ci
      - name: Test
        working-directory: ${{ github.workspace }}/${{ matrix.package_dir }}
        run: npm test

  docker-build:
    name: Docker Build (portal)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f portal/backend/Dockerfile -t primus-portal-backend:ci .
      - name: Build frontend image
        run: docker build -f portal/frontend/Dockerfile -t primus-portal-frontend:ci .
