<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Acme Corp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">Acme Corp</div>
        <div class="nav-user">
            <span id="userEmail">Loading...</span>
            <button onclick="logout()" class="btn-link">Logout</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <h1>Executive Overview</h1>
            <p>Real-time financial performance data</p>
        </header>

        <!-- State: Loading -->
        <div id="loadingState" class="state-container">
            <div class="spinner"></div>
            <p>Authenticating & Fetching Secure Data...</p>
        </div>

        <!-- State: Error -->
        <div id="errorState" class="state-container hidden">
            <div class="error-icon">⚠️</div>
            <h2>Access Denied</h2>
            <p id="errorText">Unable to verify identity.</p>
            <button onclick="fetchData()" class="btn-secondary">Retry</button>
        </div>

        <!-- State: Success (The Data) -->
        <div id="dataState" class="dashboard-grid hidden">
            <div class="card">
                <h3>Total Revenue</h3>
                <div class="metric" id="revenue">---</div>
            </div>
            <div class="card">
                <h3>YoY Growth</h3>
                <div class="metric success" id="growth">---</div>
            </div>
            <div class="card">
                <h3>Active Users</h3>
                <div class="metric" id="users">---</div>
            </div>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>

</html>
