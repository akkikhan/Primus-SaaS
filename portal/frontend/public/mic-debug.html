<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone & Speech Debugger</title>
    <style>
        body {
            font-family: monospace;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .warning {
            color: #fbbf24;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        button:hover {
            background: #2563eb;
        }

        #log {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        .meter-container {
            width: 100%;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        #volume-meter {
            width: 0%;
            height: 100%;
            background: #4ade80;
            transition: width 0.1s;
        }
    </style>
</head>

<body>
    <h1>🎤 Microphone & Speech Debugger</h1>

    <div class="status-box">
        <h3>1. Browser Compatibility</h3>
        <div id="compat-status">Checking...</div>
    </div>

    <div class="status-box">
        <h3>2. Microphone Access</h3>
        <button onclick="requestMic()">Request Microphone Permission</button>
        <div class="meter-container">
            <div id="volume-meter"></div>
        </div>
        <p id="mic-status" style="margin-top: 10px;">Not started</p>
    </div>

    <div class="status-box">
        <h3>3. Speech Recognition Test</h3>
        <button onclick="startRecognition()">Start Recognition</button>
        <p id="rec-status" style="margin-top: 10px;">Not started</p>
        <p><strong>Result:</strong> <span id="rec-result" style="color: #fbbf24;">...</span></p>
    </div>

    <h3>Debug Log</h3>
    <div id="log"></div>

    <script>
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#e2e8f0';
            el.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        // 1. Check Compatibility
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const compatEl = document.getElementById('compat-status');

        if (SpeechRecognition) {
            compatEl.innerHTML = `<span class="success">✅ Speech Recognition API is supported (${SpeechRecognition.name || 'native'})</span>`;
            log('Browser supports SpeechRecognition API', 'success');
        } else {
            compatEl.innerHTML = `<span class="error">❌ Speech Recognition API NOT supported in this browser. Try Chrome or Edge.</span>`;
            log('Browser does NOT support SpeechRecognition API', 'error');
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            log('Browser supports getUserMedia API', 'success');
        } else {
            log('Browser does NOT support getUserMedia API', 'error');
        }

        // 2. Request Mic
        async function requestMic() {
            try {
                log('Requesting microphone access...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('Microphone access GRANTED', 'success');
                document.getElementById('mic-status').innerHTML = '<span class="success">✅ Access Granted</span>';

                // Visualize volume
                const audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                const meter = document.getElementById('volume-meter');

                function updateMeter() {
                    analyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                    meter.style.width = (average * 2) + '%'; // Amplify for visibility
                    requestAnimationFrame(updateMeter);
                }
                updateMeter();
                log('Audio visualizer started. Speak to test levels.');

            } catch (err) {
                log(`Microphone Error: ${err.name} - ${err.message}`, 'error');
                document.getElementById('mic-status').innerHTML = `<span class="error">❌ Denied: ${err.message}</span>`;
            }
        }

        // 3. Test Recognition
        let recognition;

        function startRecognition() {
            if (!SpeechRecognition) {
                log('Cannot start: Speech Recognition not supported', 'error');
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'en-US';
                recognition.interimResults = true;

                recognition.onstart = () => {
                    log('Recognition service started', 'success');
                    document.getElementById('rec-status').innerText = 'Listening...';
                };

                recognition.onerror = (event) => {
                    log(`Recognition Error: ${event.error}`, 'error');
                    document.getElementById('rec-status').innerText = 'Error: ' + event.error;
                };

                recognition.onend = () => {
                    log('Recognition service disconnected');
                    document.getElementById('rec-status').innerText = 'Stopped';
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('rec-result').innerText = transcript;
                    log(`Heard: "${transcript}"`, 'success');
                };

                log('Starting recognition...');
                recognition.start();
            } catch (err) {
                log(`Startup Error: ${err.message}`, 'error');
            }
        }
    </script>
</body>

</html>
